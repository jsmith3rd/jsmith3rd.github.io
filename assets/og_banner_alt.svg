<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edgeShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4530"/>
      <stop offset="100%" stop-color="#173824"/>
    </linearGradient>
  </defs>

  <!-- full background -->
  <rect x="0" y="0" width="1200" height="630" fill="#F5F2EC"/>

  <!-- sacrificial decorative edge bars (safe to lose on crop) -->
  <rect x="0" y="0" width="90" height="630" fill="url(#edgeShade)"/>
  <rect x="1110" y="0" width="90" height="630" fill="url(#edgeShade)"/>
  <rect x="90" y="0" width="4" height="630" fill="#0E0D0B" opacity="0.06"/>
  <rect x="1106" y="0" width="4" height="630" fill="#0E0D0B" opacity="0.06"/>

  <!-- centered monogram badge -->
  <circle cx="600" cy="150" r="62" fill="#1A3A2A"/>
  <text x="600" y="172" font-family="DejaVu Serif" font-weight="bold" font-size="56" letter-spacing="2" fill="#F5F2EC" text-anchor="middle">JIII</text>

  <!-- name -->
  <text x="600" y="300" font-family="DejaVu Serif" font-weight="bold" font-size="54" fill="#0E0D0B" text-anchor="middle">John J. Smith III</text>

  <!-- title -->
  <text x="600" y="346" font-family="Liberation Sans" font-size="27" fill="#1A3A2A" font-weight="bold" text-anchor="middle">Senior Technical Product Leader</text>

  <!-- accent rule, centered -->
  <rect x="540" y="374" width="120" height="4" fill="#1A3A2A"/>

  <!-- descriptor lines, centered -->
  <text x="600" y="426" font-family="Liberation Sans" font-size="21" fill="#3A3832" text-anchor="middle">AI-enabled authoring tools &#183; publishing platforms</text>
  <text x="600" y="458" font-family="Liberation Sans" font-size="21" fill="#3A3832" text-anchor="middle">28+ years across product, engineering &amp; UX</text>

  <!-- footer rule + url, centered -->
  <rect x="500" y="512" width="200" height="1" fill="#0E0D0B" opacity="0.15"/>
  <text x="600" y="546" font-family="Liberation Sans" font-size="22" fill="#1A3A2A" font-weight="bold" text-anchor="middle">jsmith3rd.dev</text>
</svg>
