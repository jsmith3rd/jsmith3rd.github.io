<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4530"/>
      <stop offset="100%" stop-color="#173824"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#F5F2EC"/>

  <!-- left panel -->
  <rect x="0" y="0" width="420" height="630" fill="url(#panelShade)"/>

  <!-- thin inner rule on panel edge -->
  <rect x="420" y="0" width="2" height="630" fill="#0E0D0B" opacity="0.06"/>

  <!-- monogram -->
  <text x="210" y="300" font-family="DejaVu Serif" font-weight="bold" font-size="150" letter-spacing="6" fill="#F5F2EC" text-anchor="middle">JIII</text>

  <!-- thin rule under monogram -->
  <rect x="150" y="336" width="120" height="2" fill="#C8DDD1" opacity="0.6"/>

  <!-- tagline under monogram -->
  <text x="210" y="372" font-family="Liberation Sans" font-size="16" letter-spacing="4" fill="#C8DDD1" text-anchor="middle">PORTFOLIO</text>

  <!-- right content -->
  <text x="500" y="255" font-family="DejaVu Serif" font-weight="bold" font-size="58" fill="#0E0D0B">John J. Smith III</text>

  <text x="500" y="308" font-family="Liberation Sans" font-size="29" fill="#1A3A2A" font-weight="bold">Senior Technical Product Leader</text>

  <!-- accent rule -->
  <rect x="500" y="338" width="110" height="4" fill="#1A3A2A"/>

  <!-- descriptor lines -->
  <text x="500" y="392" font-family="Liberation Sans" font-size="21" fill="#3A3832">AI-enabled authoring tools &#183; publishing platforms</text>
  <text x="500" y="424" font-family="Liberation Sans" font-size="21" fill="#3A3832">28+ years across product, engineering &amp; UX</text>

  <!-- footer url -->
  <text x="500" y="560" font-family="Liberation Sans" font-size="22" fill="#1A3A2A" font-weight="bold">jsmith3rd.dev</text>

  <!-- footer hairline -->
  <rect x="500" y="580" width="640" height="1" fill="#0E0D0B" opacity="0.12"/>
</svg>
